name: Generate Stubs

on:
  workflow_dispatch:
    inputs:
      edd_version:
        description: 'Easy Digital Downloads version: "latest" (stable) or "3.6.7" (specific)'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  generate:
    runs-on: self-hosted

    steps:
      - name: Disable git hooks
        run: git config --global core.hooksPath /dev/null

      - name: Checkout easy-digital-downloads-stubs
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for tags

      - name: Download Easy Digital Downloads (stable)
        run: |
          if [ "${{ inputs.edd_version }}" = "latest" ]; then
            URL="https://downloads.wordpress.org/plugin/easy-digital-downloads.zip"
            echo "Downloading latest stable from WordPress.org..."
          else
            URL="https://downloads.wordpress.org/plugin/easy-digital-downloads.${{ inputs.edd_version }}.zip"
            echo "Downloading v${{ inputs.edd_version }} from WordPress.org..."
          fi

          curl -L "$URL" -o easy-digital-downloads.zip
          unzip -q easy-digital-downloads.zip -d .
          mv easy-digital-downloads edd-source
          echo "✓ Easy Digital Downloads downloaded"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate stubs
        env:
          EDD_PATH: ./edd-source
        run: composer generate

      - name: Install git-cliff
        run: |
          if ! command -v git-cliff &> /dev/null; then
            ARCH=$(uname -m)
            DOWNLOAD_URL=$(curl -s https://api.github.com/repos/orhun/git-cliff/releases/latest | \
              grep "browser_download_url.*${ARCH}.*linux-gnu.*tar.gz\"" | head -1 | cut -d '"' -f 4)
            if [ -n "$DOWNLOAD_URL" ]; then
              curl -sSfL "$DOWNLOAD_URL" | tar xz
              sudo mv git-cliff-*/git-cliff /usr/local/bin/
              rm -rf git-cliff-*/
            else
              pip3 install git-cliff
            fi
          fi

      - name: Update CHANGELOG
        run: git-cliff --config cliff.toml --verbose --output CHANGELOG.md

      - name: Extract EDD version
        id: version
        run: |
          VERSION=$(grep -oP "define\('EDD_VERSION', '\K[^']+" easy-digital-downloads-stubs.php)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected EDD version: $VERSION"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet easy-digital-downloads-stubs.php CHANGELOG.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in stubs or CHANGELOG"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in stubs or CHANGELOG"
          fi

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: composer test

      - name: Create branch and push
        if: steps.changes.outputs.changed == 'true'
        id: branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="stubs/edd-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add easy-digital-downloads-stubs.php CHANGELOG.md
          git commit -m "chore(stubs): update for EDD $VERSION"
          git push -u origin "$BRANCH"

          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "✅ Pushed branch $BRANCH (SHA: $SHA)"

      - name: Report status checks
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.branch.outputs.sha }}"

          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state=success \
            -f context="test" \
            -f description="Tests passed (via generate workflow)"

      - name: Create PR with auto-merge
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ steps.branch.outputs.branch }}"

          PR_URL=$(gh pr create \
            --title "chore(stubs): update for EDD $VERSION" \
            --body "Automated stub generation for Easy Digital Downloads $VERSION" \
            --head "$BRANCH" \
            --base master)

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "✅ Created PR: $PR_URL"

          gh pr merge "$PR_URL" --auto --squash --delete-branch
          echo "✅ Auto-merge enabled"

      - name: Wait for PR merge and create release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PR_URL="${{ steps.pr.outputs.pr_url }}"

          echo "Waiting for PR to be merged..."

          for i in {1..60}; do
            STATE=$(gh pr view "$PR_URL" --json state --jq '.state')
            if [ "$STATE" = "MERGED" ]; then
              echo "✅ PR merged!"
              break
            elif [ "$STATE" = "CLOSED" ]; then
              echo "❌ PR was closed without merging"
              exit 1
            fi
            echo "Waiting... ($i/60) - State: $STATE"
            sleep 10
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "❌ Timeout waiting for PR to merge"
            exit 1
          fi

          git fetch origin master
          git checkout master
          git pull origin master

          BASE_TAG="v$VERSION"
          if git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
            PATCH=1
            while git rev-parse "${BASE_TAG}.${PATCH}" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
            done
            TAG="${BASE_TAG}.${PATCH}"
            echo "Base tag $BASE_TAG exists, creating patch: $TAG"
          else
            TAG="$BASE_TAG"
            echo "Creating tag: $TAG"
          fi

          git tag "$TAG" -m "Stubs for EDD $VERSION"
          git push origin "$TAG"
          echo "✅ Created tag: $TAG"

          gh release create "$TAG" \
            --title "Easy Digital Downloads $VERSION Stubs" \
            --generate-notes \
            --verify-tag
          echo "✅ Created release for $TAG"

      - name: No changes summary
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No changes to commit. Stubs are already up to date for EDD ${{ steps.version.outputs.version }}"
