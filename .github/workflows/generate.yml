name: Generate Stubs

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: 'Easy Digital Downloads version: "latest" or "X.Y.Z"'
        required: true
        default: 'latest'
        type: string
      secondary_version:
        description: 'Unused for EDD core; declared for the shared dispatch contract'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  generate:
    uses: artkrsk/stub-package-workflows/.github/workflows/stub-generate.yml@master
    with:
      source_version: ${{ inputs.source_version }}
      wp_org_slug: easy-digital-downloads
      source_env_name: EDD_PATH
      stub_file: easy-digital-downloads-stubs.php
      version_define_name: EDD_VERSION
      release_title: 'Easy Digital Downloads'
      short_name: 'EDD'
